	<title>Jack's Website - Music Player!</title>
    <style>
        #music-player {
            border-left: 5px solid #0EE842;
            padding: 20px;
            border-radius: 10px;
            background-color: #CFCFCF;
            margin: 30px 0;
            transition: background-color 0.3s, color 0.3s;
        }
        html.dark #music-player {
            background-color: #1E1E1E;
        }
        #music-player input[type="file"] { margin-bottom: 15px; }
        #audioElement { width: 100%; margin-top: 10px; }
        .controls { display: flex; gap: 10px; margin: 15px 0; }
        .controls button {
            font-family: 'Nunito', sans-serif;
            background-color: #0EE842;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #playlist {
            list-style: none;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
        }
        #playlist li {
            padding: 5px 8px;
            cursor: pointer;
            border-radius: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #playlist li:hover { background-color: rgba(0,0,0,0.1); }
        html.dark #playlist li:hover { background-color: rgba(255,255,255,0.1); }
        #playlist li.active { font-weight: bold; color: #0EE842; }
    </style>
</head>

<header>

<section id="music-player">
    <p>Select a folder!:</p>
    <input type="file" id="folderInput" webkitdirectory directory multiple>
    <audio id="audioElement" controls></audio>
    <div class="controls">
        <button id="prevBtn">Prev</button>
        <button id="nextBtn">Next</button>
        <button id="shuffleBtn">Shuffle: Off</button>
    </div>
    <ul id="playlist"></ul>
</section>

<script src="../darkmode.js"></script>
<script>
    const folderInput = document.getElementById('folderInput');
    const audioElement = document.getElementById('audioElement');
    const playlistElement = document.getElementById('playlist');
    let audioFiles = [], currentIndex = 0, isShuffled = false, shuffleIndices = [], shufflePos = 0;

    folderInput.addEventListener('change', (e) => {
        audioFiles = Array.from(e.target.files).filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|ogg|flac|m4a)$/i.test(f.name));
        audioFiles.sort((a, b) => a.name.localeCompare(b.name));
        if (audioFiles.length > 0) {
            buildPlaylist();
            if (isShuffled) generateShuffleOrder();
            loadTrack(isShuffled ? shuffleIndices[0] : 0);
            audioElement.play();
        }
    });

    function buildPlaylist() {
        playlistElement.innerHTML = '';
        audioFiles.forEach((file, index) => {
            const li = document.createElement('li');
            
            const lastDotIndex = file.name.lastIndexOf('.');
            li.textContent = lastDotIndex !== -1 ? file.name.substring(0, lastDotIndex) : file.name;
            
            li.onclick = () => { 
                currentIndex = index; 
                if (isShuffled) {
                    shufflePos = shuffleIndices.indexOf(currentIndex);
                }
                loadTrack(currentIndex); 
                audioElement.play(); 
            };
            playlistElement.appendChild(li);
        });
    }

    function loadTrack(index) {
        currentIndex = index;
        audioElement.src = URL.createObjectURL(audioFiles[index]);
        Array.from(playlistElement.children).forEach((li, i) => {
            if (i === currentIndex) {
                li.classList.add('active');
                li.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                li.classList.remove('active');
            }
        });
    }

    function generateShuffleOrder() {
        shuffleIndices = audioFiles.map((_, i) => i);
        for (let i = shuffleIndices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffleIndices[i], shuffleIndices[j]] = [shuffleIndices[j], shuffleIndices[i]];
        }
        shufflePos = shuffleIndices.indexOf(currentIndex);
        if (shufflePos === -1) shufflePos = 0;
    }

    document.getElementById('nextBtn').onclick = () => {
        if (audioFiles.length === 0) return;
        if (isShuffled) {
            shufflePos++;
            if (shufflePos >= shuffleIndices.length) {
                generateShuffleOrder(); 
                shufflePos = 0;
            }
            currentIndex = shuffleIndices[shufflePos];
        } else {
            currentIndex = (currentIndex + 1) % audioFiles.length; 
        }
        loadTrack(currentIndex);
        audioElement.play();
    };

    document.getElementById('prevBtn').onclick = () => {
        if (audioFiles.length === 0) return;
        if (isShuffled) {
            shufflePos--;
            if (shufflePos < 0) {
                shufflePos = shuffleIndices.length - 1;
            }
            currentIndex = shuffleIndices[shufflePos];
        } else {
            currentIndex = (currentIndex - 1 + audioFiles.length) % audioFiles.length;
        }
        loadTrack(currentIndex);
        audioElement.play();
    };

    document.getElementById('shuffleBtn').onclick = (e) => {
        isShuffled = !isShuffled;
        if (isShuffled) {
            e.target.textContent = "Shuffle: On";
            generateShuffleOrder();
        } else {
            e.target.textContent = "Shuffle: Off";
        }
    };

    audioElement.onended = () => {
        document.getElementById('nextBtn').click();
    };
</script>
</body>
</html>
